<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาเข้างาน | Check-in System</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Sarabun:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Sarabun', sans-serif; background-color: #f8fafc; margin: 0; }
        .btn-animate { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-animate:active { transform: scale(0.98); }
        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal { animation: modalPop 0.3s ease-out forwards; }
    </style>
</head>
<body class="p-5 flex flex-col items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-slate-900 p-8 text-white text-center">
            <h2 class="text-2xl font-black">📍 ถ่ายรูปลงเวลา</h2>
            <p id="status" class="text-slate-400 text-xs mt-2 font-bold uppercase tracking-widest">กำลังโหลดระบบ LINE...</p>
        </div>

        <div class="p-8 space-y-5">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
            
            <!-- ปุ่มกล้อง -->
            <button id="cameraBtn" disabled class="btn-animate w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg shadow-blue-200 flex items-center justify-center gap-3 disabled:bg-slate-300">
                <i class="fa-solid fa-camera"></i> เปิดกล้องถ่ายรูป
            </button>

            <!-- แสดงตัวอย่างรูป -->
            <div id="previewContainer" class="hidden animate-modal">
                <div class="relative rounded-2xl overflow-hidden border-4 border-white shadow-lg bg-slate-50 aspect-[3/4]">
                    <img id="preview" class="w-full h-full object-cover">
                </div>
                
                <!-- ปุ่มส่งข้อมูล -->
                <button id="sendBtn" class="btn-animate w-full bg-emerald-500 text-white py-5 rounded-2xl font-black text-lg mt-5 shadow-lg shadow-emerald-100 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลเข้างาน
                </button>
            </div>
        </div>
    </div>

    <!-- ผลลัพธ์หลังส่งสำเร็จ (Modal) -->
    <div id="resultModal" class="fixed inset-0 z-50 hidden items-center justify-center p-6 bg-slate-900/90 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-10 text-center animate-modal shadow-2xl">
            
            <!-- กรณีตรงเวลา -->
            <div id="onTimeBox" class="hidden">
                <div class="h-24 w-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fa-solid fa-check text-5xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-900">บันทึกสำเร็จ!</h3>
                <p class="text-emerald-600 font-bold mt-2">เข้างานตรงเวลา</p>
            </div>

            <!-- กรณีมาสาย -->
            <div id="lateBox" class="hidden">
                <img src="https://i.postimg.cc/7YtdqNVk/depositphotos-23480907-stock-photo-human-hand-pointing.webp" class="w-32 h-32 mx-auto rounded-full object-cover border-4 border-rose-500 mb-6 shadow-lg">
                <h3 class="text-2xl font-black text-rose-600">คุณมาสาย!</h3>
                <p class="text-rose-500 font-bold mt-4 bg-rose-50 p-4 rounded-2xl border border-rose-100">
                    ⚠️ กรุณาโทรไปสารภาพความผิด<br>กับเจ๊เดี๋ยวนี้!
                </p>
            </div>

            <p class="text-slate-400 text-[10px] mt-8 uppercase font-bold tracking-widest">หน้าต่างนี้จะปิดลงอัตโนมัติ</p>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <!-- หน้ากากโหลดข้อมูล -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-40 hidden flex-col items-center justify-center">
        <div class="h-12 w-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-slate-900 text-xs tracking-widest uppercase">กำลังบันทึกข้อมูล...</p>
    </div>

    <script>
        const LIFF_ID = "2010049335-xhTAw8Mi"; 
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwt1q2lwvbCFxkIJ49XTvRH6hKejC1RwRsNEZnPUMIvICzdyf9HrG44NvKt_Jmhy6bUNg/exec";

        const cameraInput = document.getElementById('cameraInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const sendBtn = document.getElementById('sendBtn');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('previewContainer');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultModal = document.getElementById('resultModal');

        let userLineId = "";
        // Keep the token obtained while LIFF is active. On iPhone the native
        // camera can briefly background the LIFF view; asking LIFF for a new
        // token only after returning from the camera may then return null.
        let lineAccessToken = "";
        let finalImageData = "";
        let isLate = false;

        // เริ่มต้น LIFF
        async function initializeLiff() {
            await liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true });

            if (!liff.isLoggedIn()) {
                throw new Error("กรุณาเปิดระบบจากเมนูในแอป LINE แล้วลองใหม่");
            }

            const profile = await liff.getProfile();
            const accessToken = liff.getAccessToken();
            if (!accessToken) {
                throw new Error("ไม่พบ LINE session กรุณาปิดแล้วเปิดระบบจากเมนู LINE ใหม่");
            }

            userLineId = profile.userId;
            lineAccessToken = accessToken;
            statusText.innerText = "ระบบพร้อมใช้งาน";
            cameraBtn.disabled = false;
        }

        initializeLiff().catch(err => {
            statusText.innerText = "ไม่สามารถเชื่อมต่อ LINE ได้";
            alert("❌ " + err.message);
        });

        // กดปุ่มเปิดกล้อง
        cameraBtn.onclick = () => cameraInput.click();

        // เมื่อถ่ายรูปเสร็จ
        cameraInput.onchange = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            statusText.innerText = "กำลังประมวลผลรูปภาพ...";
            cameraBtn.style.display = "none";

            const img = new Image();
            img.onload = () => {
                const MAX_WIDTH = 800;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) {
                    height = Math.floor((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const now = new Date();
                isLate = (now.getHours() > 8) || (now.getHours() === 8 && now.getMinutes() > 40);

                const timeString = now.toLocaleString('th-TH');
                ctx.fillStyle = isLate ? "rgba(225, 29, 72, 0.6)" : "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, height - 60, width, 60);
                ctx.font = "bold 24px Sarabun, Arial";
                ctx.fillStyle = "#ffffff";
                ctx.fillText((isLate ? "🚩 สาย: " : "📍 เวลา: ") + timeString, 20, height - 20);

                finalImageData = canvas.toDataURL('image/jpeg', 0.7);
                preview.src = finalImageData;
                previewContainer.classList.remove('hidden');
                statusText.innerText = "ตรวจสอบรูปภาพแล้วกดปุ่มส่ง";
            };
            img.src = URL.createObjectURL(file);
        };

        // กดส่งข้อมูล
        sendBtn.onclick = async () => {
            if (!finalImageData) return;

            // Do not call getAccessToken here: returning from the device camera
            // may leave the LIFF SDK unable to read a token even though the
            // already-issued token is still valid.
            if (!userLineId || !lineAccessToken) {
                alert("❌ LINE session หมดอายุ กรุณาปิดและเปิดระบบจากเมนู LINE ใหม่ก่อนถ่ายรูป");
                return;
            }
            
            sendBtn.disabled = true;
            loadingOverlay.classList.remove('hidden');
            loadingOverlay.classList.add('flex');

            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    redirect: 'follow', 
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        userId: userLineId,
                        accessToken: lineAccessToken,
                        image: finalImageData
                    })
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    // The server is the source of truth for attendance status.
                    // Keep the browser calculation only for the watermark preview.
                    isLate = Boolean(result.isLate);
                    loadingOverlay.classList.add('hidden');
                    resultModal.classList.remove('hidden');
                    resultModal.classList.add('flex');
                    
                    if (isLate) document.getElementById('lateBox').classList.remove('hidden');
                    else document.getElementById('onTimeBox').classList.remove('hidden');
                    
                    setTimeout(() => liff.closeWindow(), 5000); 
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                loadingOverlay.classList.add('hidden');
                alert("❌ เกิดข้อผิดพลาด: " + error.message);
                sendBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
